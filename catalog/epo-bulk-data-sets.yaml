id: epo-bulk-data-sets
type: dataset
title: EPO Patent Bulk Data Sets and Open Patent Services
description: |
  The European Patent Office's raw patent data products: EP bibliographic and full-text data, the European Patent Register, the worldwide bibliographic (DOCDB) and legal event (INPADOC) databases, sequence listings, and Boards of Appeal decisions. The same data is available through the Open Patent Services (OPS) REST API, and it underlies Espacenet and most European patent analytics.
