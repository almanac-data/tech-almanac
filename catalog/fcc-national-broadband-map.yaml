id: fcc-national-broadband-map
type: dataset
title: FCC National Broadband Map (Broadband Data Collection)
description: |
  Location-level US fixed broadband availability and modelled mobile coverage, as reported twice a year by internet service providers to the FCC's Broadband Data Collection, with provider and area summaries, challenge data and bulk downloads. It is the basis for federal broadband funding decisions.
