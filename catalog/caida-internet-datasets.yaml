id: caida-internet-datasets
type: dataset
title: CAIDA Internet Measurement Datasets
description: |
  The dataset collection of the Center for Applied Internet Data Analysis (CAIDA) at UC San Diego: Internet topology (Ark traceroute, ITDK), BGP-derived AS relationships and prefix-to-AS mappings, network telescope and anonymized passive traces, among others. Some are public; many need an approved request.
