notes: |
  Human-verified 2026-10-31: HTTP 200. https://api.scorecard.dev/ serves a Swagger UI titled "OpenSSF Scorecard" documenting the API. An unauthenticated GET for https://api.scorecard.dev/projects/github.com/ossf/scorecard returned HTTP 200 with JSON ("date":"2026-10-31T01:38:32Z", "scorecard":{"version":"v5.6.0"...}). The project README (https://raw.githubusercontent.com/ossf/scorecard/main/README.md; github.com itself returned HTTP 403 to this session) says "Scorecard scans more than 1.3 million repositories every week" and "Results are available through the REST API. The BigQuery public dataset is no longer available; see Scorecard Infrastructure Changes" (GitHub issue #5208). So the BigQuery route named in the curation brief is retired; only the API is catalogued. The README also notes weekly-scan scores "omit the CI-Tests, Contributors, and Dependency-Update-Tool checks". The site footer at https://scorecard.dev/ reads "Copyright © OpenSSF Scorecard a Series of LF Projects, LLC", so the operator is the OpenSSF under the Linux Foundation, recorded as international-ngo. No bulk export was found; rate limits were not documented in the parts read. Besides the weekly scan, projects using the Scorecard GitHub Action with publish_results update their results on each change.
  Licence checked 2026-10-31: the README's "Scorecard REST API" section states "Data provided by the REST API is licensed under the CDLA Permissive 2.0" (linking https://cdla.dev/permissive-2-0). This is explicit and data-specific; it appears in the project's GitHub README rather than on the API page itself. The scorecard.dev footer points to https://lfprojects.org for website terms (not opened).
