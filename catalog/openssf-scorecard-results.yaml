id: openssf-scorecard-results
type: dataset
title: OpenSSF Scorecard Results (REST API)
description: |
  Pre-computed security-practice scores (branch protection, code review, maintenance, pinned dependencies, dangerous workflows, signed releases and more) for over a million open-source repositories, from the OpenSSF's weekly scan and from projects publishing their own results, served through a public REST API. A widely used signal of open-source supply-chain hygiene.
publisher: Open Source Security Foundation (OpenSSF Scorecard, a Series of LF Projects, LLC / Linux Foundation)
