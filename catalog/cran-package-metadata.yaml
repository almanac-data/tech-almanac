id: cran-package-metadata
type: dataset
title: CRAN Package Repository Metadata
description: |
  Machine-readable indexes of all packages on CRAN, the Comprehensive R Archive Network (DESCRIPTION fields such as version, licence, dependencies, maintainer and publication date, in packages.rds and the PACKAGES index), alongside daily check results and the archive of past versions. The authoritative record of the R package ecosystem.
publisher: CRAN team (Comprehensive R Archive Network), with resources of the R Foundation and WU Wien
jurisdiction:
  scope: international-ngo
  country: null
