id: ntia-internet-use-survey
type: dataset
title: NTIA Internet Use Survey (CPS Computer and Internet Use Supplement)
description: |
  The US government's long-running survey of how Americans go online, fielded as a supplement to the Census Bureau's Current Population Survey. It covers internet use by location, devices, home connectivity, reasons for non-use and online activities, with public use microdata for every wave since 1998 and NTIA's summary Analyze Table.
