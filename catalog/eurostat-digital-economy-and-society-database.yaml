id: eurostat-digital-economy-and-society-database
type: dataset
title: Eurostat Digital Economy and Society Database
description: |
  Eurostat's official EU statistics on the digital economy and society, drawn mainly from the harmonised ICT usage surveys of households, individuals and enterprises. They cover internet access and use, broadband, digital skills, e-commerce, e-government, and enterprises' use of cloud, AI and other digital technologies across member states.
