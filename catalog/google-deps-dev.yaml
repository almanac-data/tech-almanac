id: google-deps-dev
type: dataset
title: deps.dev Open Source Insights Dependency Graph
description: |
  Resolved dependency graphs, dependents, licences, advisories and project metadata for packages in npm, PyPI, Maven, Cargo, Go, NuGet and RubyGems, rebuilt by Google from the public registries and served through a web portal, a REST API and a BigQuery public dataset with full periodic snapshots. A company-run source with an explicit licence for the data it generates.
publisher: Google LLC (Open Source Insights, deps.dev)
jurisdiction:
  scope: national
  country: US
topics:
- open-source-software
- dependency-graphs
- package-ecosystems
- software-supply-chain
- software-licences
source:
  canonical_url: https://docs.deps.dev/bigquery/v1/
access:
  method:
  - web
  - api
  auth_required: false
  auth_note: The REST API needs no key; the BigQuery dataset (bigquery-public-data.deps_dev_v1) needs a Google Cloud account (free sandbox tier, or billing for large queries)
  rate_limit: null
format:
- json
- bigquery
