notes: |
  Human-verified 2026-11-01: HTTP 200 (plain curl). The issue's URL, https://archive.org/developers/wayback-cdx-server.html, returns 404, as does /developers/wayback-cdx-server-api.html. This page, "Wayback Machine APIs | Internet Archive", is the Internet Archive's own listing of "currently supported APIs": the "Wayback Availability JSON API" (http://archive.org/wayback/available?url=example.com), the "Memento API", and the "Wayback CDX Server API", which it describes as "another API which allows for complex querying, filtering and analysis of Wayback capture data". It says "The latest documentation on the CDX server can be found at: Wayback CDX Server @ GitHub", linking https://github.com/internetarchive/wayback/tree/master/wayback-cdx-server. That README is the detailed CDX reference; this session's proxy could not reach GitHub to read it. The page is dated "Updated on September, 24, 2013". The developer docs index (https://archive.org/developers/index-apis.html, HTTP 200) also lists "Wayback machine APIs ... for determining if a URL is stored on the Wayback Machine and for querying, filtering and analysis of snapshot data", with a Swagger reference whose spec (https://archive.org/developers/_static/wayback.json) covers only /wayback/available, and a "Bots, LLMs, and Automated Access" page on user-agent and rate-limit expectations (not read). The CDX endpoint (https://web.archive.org/cdx/search/cdx) was not reachable from this session (connection reset over HTTPS, 403 over HTTP), so I did not test a query, the output formats or the limits; json and txt are the documented CDX outputs, not confirmed here. The underlying WARC crawl files are not offered for bulk download through these APIs, and this entry does not cover them.
  Licence checked 2026-11-01: Internet Archive Terms of Use, dated "31 Dec 2014" (https://archive.org/about/terms, read in headless Chromium): "Access to the Archive's Collections is provided at no cost to you and is granted for scholarship and research purposes only." The terms also say the Collections come "from around the world" and that the Archive "does not endorse or sponsor any content in the Collections". These are terms of use, not an open data licence, and archived pages keep their owners' copyright. The Almanac's own recovery[] links depend on this service.
