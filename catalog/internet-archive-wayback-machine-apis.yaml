id: internet-archive-wayback-machine-apis
type: dataset
title: Internet Archive Wayback Machine APIs (Availability, Memento and CDX Server)
description: |
  The Internet Archive's public interfaces to the Wayback Machine's capture index: the Availability JSON API, Memento support, and the Wayback CDX Server, which allows "complex querying, filtering and analysis of Wayback capture data". Together they are the main way to ask what the Wayback Machine holds for a URL, and when it was captured.
