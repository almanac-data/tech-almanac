  temporal: not checked
  cadence: daily
license: 'npm Open Source Terms (last updated March 10, 2022): non-exclusive, non-transferable permission to use npm Open Source, including "You may replicate data from the Public Registry using the Public APIs per this Agreement"; not an open data licence; package contents keep their own licences'
attribution: npm public registry, npm, Inc.
notes: |
  Human-verified 2026-10-31: HTTP 200. The "Replication and web crawler policy" page says "npm's full public dataset is available via the public registry. Using CouchDB replication, you can get a full copy of all metadata, and it is acceptable within our terms of use to download copies of tarballs for inspection or experimentation", and allows experimental website crawlers "as long as they keep their request velocity to 1 request per second or less". The replication host https://replicate.npmjs.com/ answered HTTP 200 with {"db_name":"registry","engine":"npm-replicate","doc_count":4554347,...}, and https://replicate.npmjs.com/_changes?limit=1 returned a changes-feed row (HTTP 200). The policy page is catalogued as the canonical URL because the replication host is a raw API root. The data lives at npm's own endpoints, not a mirror. The Open Source Terms say "npm, Inc. (npm) operates each of those services"; npm, Inc. is owned by GitHub (Microsoft), a company, so jurisdiction national/US records its legal seat only. Not checked: the replication API's documented parameters, whether a full replication is practical at this scale, and download-count endpoints (api.npmjs.org). Cadence "daily" is a placeholder: the changes feed is continuous.
  Licence checked 2026-10-31: npm Open Source Terms (https://docs.npmjs.com/policies/open-source-terms/), "npm last updated these npm Open Source Terms on March 10, 2022". They grant permission that "is not exclusive to you, and you cannot transfer it to anyone else", say "You may replicate data from the Public Registry using the Public APIs per this Agreement", and forbid automated access to the Website "with a web crawler ... that is not a web browser" beyond the crawler policy. This is a terms-of-service permission, not a licence that addresses redistribution of the metadata; re-publishing a derived dataset is not clearly covered.
