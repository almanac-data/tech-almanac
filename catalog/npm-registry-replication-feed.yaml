id: npm-registry-replication-feed
type: dataset
title: npm Public Registry Metadata (Replication Feed)
description: |
  The full metadata of the npm public registry (every package document with its versions, dependencies, maintainers and timestamps), obtainable through npm's CouchDB-style replication endpoint and changes feed. The largest single package ecosystem; npm has no periodic bulk dump, so replication is the sanctioned route to the whole dataset.
publisher: npm, Inc. (GitHub, Inc.)
jurisdiction:
  scope: national
  country: US
topics:
- open-source-software
- package-ecosystems
- javascript
- software-metadata
source:
  canonical_url: https://docs.npmjs.com/policies/crawlers/
access:
  method:
  - api
  auth_required: false
  auth_note: null
  rate_limit: 'Website crawlers: "1 request per second or less" (crawler policy); no limit stated for the replication endpoint'
format:
- json
status: live
status_since: '2026-10-31'
status_source: curator
