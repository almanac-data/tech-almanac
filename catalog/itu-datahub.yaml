title: ITU DataHub (ICT indicators)
description: |
  The International Telecommunication Union's official global ICT statistics for about 200 economies: Internet use, fixed and mobile broadband subscriptions, mobile network coverage, traffic, ICT prices, household ICT access and use, and telecom regulatory information. It replaces the paid World Telecommunication/ICT Indicators Database.
