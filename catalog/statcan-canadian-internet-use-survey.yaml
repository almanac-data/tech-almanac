title: Statistics Canada Canadian Internet Use Survey (CIUS)
description: |
  Canada's official survey of how residents aged 15 and over use the internet and digital technologies. It covers internet access and use, connected devices, e-commerce, government online services, digital skills, online security, privacy and trust, online work, AI adoption, and barriers to access.
