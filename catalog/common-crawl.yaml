id: common-crawl
type: dataset
title: Common Crawl Web Crawl Archives
description: |
  Monthly open crawls of the public web (about 2 billion pages and over 100 TiB compressed per crawl) as raw WARC captures, WAT metadata and WET extracted text, with CDXJ/URL indexes and host- and domain-level web graphs. A widely cited snapshot series of the web itself.
publisher: Common Crawl Foundation
