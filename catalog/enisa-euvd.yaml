id: enisa-euvd
type: dataset
title: ENISA European Vulnerability Database (EUVD)
description: |
  The EU's vulnerability database, maintained by ENISA under the NIS2 Directive: publicly known vulnerabilities in ICT products and services with EUVD and alias identifiers (CVE, GHSA), CVSS scores, EPSS exploitation probability, exploited-in-the-wild flags and vendor data, including those coordinated by EU CSIRTs.
publisher: European Union Agency for Cybersecurity (ENISA)
jurisdiction:
  scope: regional-bloc
  country: null
topics:
- cybersecurity
- vulnerabilities
- cve
- exploited-vulnerabilities
- nis2
source:
  canonical_url: https://euvd.enisa.europa.eu/
access:
  method:
  - web
  - api
  auth_required: false
  auth_note: null
  rate_limit: API responses capped at 100 records per search request (8 for the front-page endpoints); no request-rate limit stated
format:
- json
status: live
status_since: '2026-10-31'
status_source: curator
observed:
