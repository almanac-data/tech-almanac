id: psf-pypi-bigquery-datasets
type: dataset
title: PyPI Download Statistics and Distribution Metadata (BigQuery)
description: |
  The Python Package Index's two public BigQuery tables: per-file download events streamed from PyPI's logs (bigquery-public-data.pypi.file_downloads) and the core metadata of every release ever uploaded (bigquery-public-data.pypi.distribution_metadata). The standard source for measuring Python package usage.
