id: wipo-ip-statistics-data-center
type: dataset
title: WIPO IP Statistics Data Center
description: |
  The World Intellectual Property Organization's global statistics on intellectual property activity: patent, utility model, trademark and industrial design applications, grants and rights in force by office, origin and technology field, plus use of the PCT, Madrid and Hague international filing systems. It is the standard source for cross-country patent counts.
