id: cloudflare-radar
type: dataset
title: Cloudflare Radar Internet Traffic and Security Data
description: |
  Aggregate Internet trends observed across Cloudflare's network, served through the Radar API: HTTP request and NetFlow traffic, application- and network-layer attacks, BGP anomalies, DNS, and domain rankings, by country and network. A company-run source with an explicit (non-commercial) data licence.
publisher: Cloudflare, Inc. (Cloudflare Radar)
