id: mlab-measurement-lab
type: dataset
title: Measurement Lab (M-Lab) Open Internet Measurement Data
description: |
  Open Internet measurement data collected by the M-Lab platform worldwide: NDT speed tests (download, upload, round-trip time, packet loss), traceroute and reverse traceroute paths, TCP INFO, packet headers and Wehe traffic-differentiation tests, plus monthly global summary statistics.
publisher: Measurement Lab (M-Lab)
