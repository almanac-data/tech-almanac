id: libraries-io-package-data
type: dataset
title: Libraries.io Open Source Package Data (API)
description: |
  Metadata on about 10 million open-source packages across dozens of package managers (versions, declared licences, dependencies, dependents, source repositories), scraped from public registries and served through a keyed REST API. A company-run source with an explicit CC-BY-SA-4.0 data licence; its former bulk open-data dumps are no longer offered on the site.
publisher: Libraries.io (Tidelift, Inc.; site now branded Sonar, footer "Copyright © 2026 SourceSource SA")
jurisdiction:
  scope: national
  country: US
topics:
- open-source-software
- package-ecosystems
- dependency-graphs
- software-licences
source:
  canonical_url: https://libraries.io/api
access:
  method:
  - api
  - web
  auth_required: true
  auth_note: Free Libraries.io account; every API request needs an api_key parameter
  rate_limit: 60 requests/minute per API key (429 beyond that)
format:
- json
status: live
status_since: '2026-10-31'
status_source: curator
observed:
  checked: '2026-10-31'
  reachable: true
  http_status: 200
  final_url: https://libraries.io/api
  redirect_chain: []
  fingerprint_result: no-baseline
coverage:
  spatial: global (public package registries)
  temporal: not checked
  cadence: irregular
license: CC-BY-SA-4.0 (Libraries.io Terms and Conditions, "Licensing of Libraries.io Data", data-specific statement)
attribution: '"includes data gathered by Libraries.io" (publications) or "powered by Libraries.io" (services), per the Libraries.io terms'
notes: |
  Human-verified 2026-10-31: HTTP 200. The API page says "All API requests must include api_key parameter" and "All requests are subject to a 60 request/minute rate limit based on your API key"; its examples show recent data (an npm package's "latest_stable_release_published_at": "2026-10-19"). The home page says "Libraries.io is a free service that collects publicly available open source package information scraped from the internet. With it you can search 9.96M packages" and warns "Data available via Libraries.io is scraped from the internet and not validated, corrected, or curated for accuracy", pointing to the paid Tidelift offering. The old open-data page https://libraries.io/data now redirects (301) to the home page, so bulk dumps are no longer offered there; the last Zenodo release found (record 3626071, version 1.6.0, published 2020-01-12, licence cc-by-4.0) is frozen and is not catalogued here. Operator: the terms say "The Libraries.io name and logos are the trademarks of Tidelift, Inc.", while the footer reads "Copyright © 2026 SourceSource SA" (apparently a misspelling of SonarSource SA, Tidelift's parent; not verified) and links Sonar products. Jurisdiction national/US records Tidelift's seat only; it may be more accurate to treat the operator as Swiss. No API call was made (no key). Cadence "irregular" is a placeholder: data is continuously scraped, frequency not checked.
  Licence checked 2026-10-31: Terms and Conditions (https://libraries.io/terms), section "Licensing of Libraries.io Data": "Data provided by the Service is licensed to you under version 4.0 of the Creative Commons Attribution, Share Alike license (CC BY-SA). This license grants permissive rights for users to use the data commercially..." and "You may comply with Sec. 3(1)(A)(i) of CC BY-SA by using the text 'includes data gathered by Libraries.io' in your publication or 'powered by Libraries.io' if providing a service." The footer repeats "Data is available under CC-BY-SA 4.0 license". Share-alike applies to derived datasets.
