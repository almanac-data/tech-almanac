id: rust-foundation-crates-io-database-dumps
type: dataset
title: crates.io Database Dumps
description: |
  Daily PostgreSQL-ready CSV dumps of all public information in the crates.io database (crates, versions, dependencies, owners, categories, keywords and download counts), with archived per-version daily downloads back to November 2014. The complete registry record for the Rust package ecosystem.
publisher: Rust Foundation (crates.io team)
jurisdiction:
  scope: international-ngo
  country: null
topics:
- open-source-software
- package-ecosystems
- rust
- package-downloads
- dependency-graphs
source:
  canonical_url: https://crates.io/data-access
access:
  method:
  - bulk
  - api
  auth_required: false
  auth_note: null
  rate_limit: 'API: "A maximum of 1 request per second" plus an identifying User-Agent; no limits stated for the sparse index or static.crates.io'
format:
- csv
- sql
- tar.gz
status: live
status_since: '2026-11-01'
status_source: curator
observed:
  checked: '2026-11-01'
  reachable: true
  http_status: 200
  final_url: https://crates.io/data-access
  redirect_chain: []
  fingerprint_result: no-baseline
coverage:
  spatial: global (all crates published to crates.io)
  temporal: full registry history in each dump; historical version downloads back to November 2014 (per the dump README)
  cadence: daily
license: unverified — no licence for the dump data found on the Data Access Policy page or in the dump's README; the crates.io Usage Policy is CC-BY-4.0 but that covers the policy text, not the data
attribution: crates.io database dump, Rust Foundation / crates.io team (<dump timestamp, e.g. 2026-10-31-020010>)
notes: |
  Human-verified 2026-10-31: HTTP 200 in headless Chromium; plain curl got HTTP 403 (and 404 with a minimal browser User-Agent), because crates.io is a JavaScript app behind bot filtering that serves its pages only to requests asking for HTML. Re-added 2026-11-01 after the link checker began sending a browser's Accept header (almanac-template #62); with it, the checker's browser-UA retry gets HTTP 200. The Data Access Policy page says "crates.io database dumps contain all information available through the crates.io API in a single download. They are updated every 24 hours. The latest dump is available at the address https://static.crates.io/db-dump.tar.gz." That URL redirects (307) to https://cloudfront-static.crates.io/db-dump.tar.gz, which answered HTTP 200 with content-length 2,118,275,837 and last-modified Sat, 31 Oct 2026 02:06:53 GMT. The first 3 MB were read: the archive root is "2026-10-31-020010/" with README.md, metadata.json (timestamp "2026-10-31T02:00:10Z"), schema.sql, import.sql and data/*.csv (categories, crate_downloads, crates, ...). The README says the live version_downloads table covers 90 days and "All available historical data (back to November 2014) ... is available at https://static.crates.io/archive/version-downloads/ in CSV form", and warns that CSV fields contain user-supplied text unmodified. The page also documents the sparse index (index.crates.io), RSS feeds and the API. The Usage Policy names "the Rust Foundation as the official legal entity providing the crates.io service"; the Foundation is US-registered and is recorded as international-ngo, like other foundation-run global registries in this vertical.
  Licence checked 2026-10-31: none found. The Data Access Policy page (https://crates.io/data-access) states access rules and rate limits but no licence; the dump README has no licence section; the Usage Policy (https://crates.io/policies) ends "Licensed under the Creative Commons Attribution 4.0 International license", which applies to that policy document. Crate metadata is author-submitted, and the dump includes user names and GitHub logins. Treat re-use terms as unstated. Not checked: the full CSV list beyond the first few files, and the dump changelog (GitHub issue #3617).
